on), działają na zasadzie modułu Simplex - a więc, jeżeli zastępca chciałby aby usłyszeli go inni zastępcy, musi poprosić o patch, co jest używane tylko w określonych wewnętrzną polityką przypadkach.\n\nDo porozumiewania się pomiędzy wami oficerami a Dispatch będzie służyć komenda !1 [callsign], [treść]. Na tym właśnie kanale głównym zgłaszać będziecie swoje działania dynamiczne, T-Stops (wyjątek względem CAD), zapotrzebowania itd. Dla rozjaśnienia, podam kilka przykładów co zgłaszacie na właśnie kanale Dispatch:\n\n!1 2A15, kod 6 na Power Street i Alta Street.. widzę TC, daj mi RA.\n!1 2L16, w drodze do 9-1-1 odnośnie wandalizmu na Grove Street LTD Gas Station, kod 3\n!1 2A32, kod 6 do T-Stop, czarny Blista.. tablice to Adam-Boy-David-Frank-2-1-Nancy. Palomino Avenue na północ z Vespucci.\n!1 2A15, w pościgu za czarnym Merit, Adam-3-Boy-2-Charles-1, w środku możliwe osoby z rabunku, daj mi wsparcie dwóch, Supervisory oraz Airship na Tac 1!\nINTERDEPARTAMENTAL RADIO\nRadio między-departamentowe to określenie na kanał gdzie możecie informować inne agencje Law oraz Med o swoich zapotrzebowania na ich konkretne jednostki lub przekazywać im jakieś ważne informacje. Do użycia tego kanału należy wpisać komendę /d. Obowiązuje na tym kanale szyk wiadomości, mianowicie:\n\n/d Police \u003e [Agencja]; Jednostka [Callsign] zgłosiła / zgłasza zapotrzebowanie na [jednostka/ki innej agencji], [do czego? opis sytuacji]. Jednostka znajduje się [lokalizacja].\n\nPoniżej przedstawiam wam również całą rozpiskę identyfikacji innych agencji na kanale /d:\n\nLSPD - Police\nLSSD - LSSO\nSPPO - State Parks\nLSFD - Fire\nLSFD RA / DCMC / other medicals - EMS\nCoroner - DMEC\nFBI / ICE / other federal - FBI / ICE / etc.\n\nPrzykład:\n\n/d Police \u003e EMS; Jednostka 2A15 zgłosiła zapotrzebowanie na RA do chłopaka, około 17 lat, ze złamaniem prawej ręki, oddycha i jest przytomny. Znajdują się na Forum Drive w Chamberlain Hills.\nWHISPER\nJest to funkcja tylko i wyłącznie dla dynamicznych zgłoszeń. Używacie go w przypadku pościgów lub innych sytuacji, kiedy napisanie czegoś może być czasowo niepraktyczne. Dla przykładu, jeżeli jesteś sam w jednostce, to znaczy jesteś Lincolnem - rozpoczynając pościg, twoim zadaniem jest użycie Whispera na TeamSpeak informując jednostki o prowadzonym pościgu, w sposób dokładnie taki sam jak na !1. Zgłoszenie ma być krótkie i treściwe, zarówno na Whisper jak i na !1. Kilka przykładów poniżej:\n\nWhisper: 2A15, prowadzę pościg za czarną Blista, jesteśmy na Palomino Avenue w Vespucci na północ, TAC-1.\nWhisper: 2 Adam 32, jesteśmy w aktywnym pościgu za szarym Sadlerem, z Little Seul na Downtown, TAC-2.\n\nBędąc również jednostką Adam masz prawo do użycia Whispera przy pościgu - staraj się jednak zrobić to jeden raz, a następne zgłoszenia niech będą już pisane przez RTO na !1, chodzi o fakt aby za pierwszym razem jak najszybciej poinformować inne jednostki o aktywnie trwającym pościgu.\nCAD\nComputer Aided Dispatch to wbudowany w Mobile Data Computer system zdalnego Dispatch, w którym oficerowie mogą wprowadzać raporty ze scen, aktualizować aktualnie trwające sceny oraz swoje działania. W przełożeniu na grę, będzie to komenda /pager 1 [callsign]: [treść].\n"},{"ty":"as","st":"document","si":0,"ei":0,"sm":{"ds_pw":595.4399999999999,"ds_lhs":1,"ds_df":{"df_dm":1},"ds_ulhfl":false,"ds_ph":841.68}},{"ty":"ae","et":"list","id":"kix.3se1xmw7bpjm","epm":{"le_nb":{"nl_4":{"b_gf":"%4","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_bd":false,"ts_fgc2_i":true,"ts_tw":400,"ts_it_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_st":false,"ts_sc_i":true},"b_ifl":162.0,"b_gs":"○","b_a":0,"b_sn":1,"b_gt":9,"b_il":180.0},"nl_3":{"b_gf":"%3","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_typ , DOCS_modelChunkLoadStart - DOCS_modelChunkParseStart); DOCS_warmStartDocumentLoader.loadModelChunk(DOCS_modelChunk); DOCS_modelChunk = undefined;</script><script nonce="RCuW7JF-lc_ad-MdOo1SPQ">DOCS_modelChunkParseStart = new Date().getTime();</script><script nonce="RCuW7JF-lc_ad-MdOo1SPQ">DOCS_modelChunk = [{"ty":"is","ibi":4059,"s":"\nCAD posiada swoje własne zasady komunikowania się, obowiązują tutaj inne rodzaje zgłoszeń oraz stosowane są inne kody. Ogólnie mówiąc o tym, co należy zgłaszać na /pager, są to kody 6 które nie są dynamiczne, np. Otrzymaliśmy zgłoszenie 911 odnośnie nielegalnie zaparkowanego pojazdu na podjeździe posesji osoby X, blokując z niej wyjazd - reakcję do tego zgłoszenia zgłosisz naturalnie na radiu wewnętrznym !1. Dojeżdżając na miejsce zgłosisz poprzez CAD swój kod 6 na miejscu tego zgłoszenia w sposób następujący:\n\n/pager 1 2A12: C6CZN, Mirror Park Blvd., lub\n/pager 1 2A12: C6CZN, 586, Mirror Park Blvd.\n\nTak samo za pomocą CAD wprowadzany będzie status waszej jednostki - dostępna lub niedostępna:\n\n/pager 1 2A16: Dostępna\n/pager 1 2A16: Niedostępna\n\nPoniżej wymieniam wam pełną listę kodów do użytkowania w CAD:\n\n\u0010\u0012\u001cC6\n\u001cCode 6\n\u0012\u001cC6PED\n\u001cPedestrian Stop\n\u0012\u001cC6TS\n\u001cTraffic Stop\n\u0012\u001cC6INV\n\u001cInvestigation\n\u0012\u001cC6FU\n\u001cFollow up Investigation\n\u0012\u001cC6CZN\n\u001cCitizen Call (9-1-1)\n\u0012\u001cC6CM\n\u001cCommunity Meeting\n\u0012\u001cC6STM\n\u001cStation Meeting\n\u0012\u001cC6STA\n\u001cStation Call\n\u0012\u001cC6ME\n\u001cCommunity Engagement\n\u0012\u001cC7\n\u001cCode 7\n\u0011\nRównież wartym zapamiętania jest aby w CAD używać skrótów takich jak Avenue - Ave., czy Boulevard - Blvd. Chodzi nie tylko o przełożenie tego jak działa to w rzeczywistości ale również pole na jakim wyświetla się wiadomość z pagera nie jest największe.\nROVER\nRemote Out-of-Vehicle Emergency Radio to profesjonalne określenie na radiotelefon, który posiada na swoim pasie służbowym każdy oficer. W głównej mierze, model ten to Motorola APX 8000. LAPD wprowadziło ROVER we wczesnych latach 80-tych, jako część szerszych wysiłków mających na celu zwiększenie możliwości komunikacyjnych oficerów. Radiotelefony ROVER umożliwiły oficerom utrzymywanie komunikacji z Dispatch i innymi jednostkami, gdy znajdowali się z dala od swoich radiowozów, poprawiając bezpieczeństwo i koordynację podczas działań w terenie. Radiotelefony te są niezbędne dla oficerów LAPD, gdy są poza swoimi radiowozami, na przykład podczas pieszych patroli lub reakcji na sytuacje awaryjne.\nPANIC BUTTON\nKażdy ROVER, który posiada przy sobie każdy oficer, ma tzw. Panic Button - jest to mały czerwony przycisk od strony anteny radiotelefonu (Emergency Trigger). Jego naciśnięcie jest czynnością nazywaną ROVER Activated. Oficer w potrzebie wciska Emergency Trigger wywołując funkcję ROVER Activated, w tym momencie jego radio automatycznie przełącza się na Emergency Channel. Będąc na nim, ROVER również rozpoczyna wysyłanie sygnałów do RTO przez 30 sekund co 5 sekund sygnał. W tym momencie RTO ma czas na zlokalizowanie radia na podstawie przypisania go do odpowiedniego callsign i ostatniej lokalizacji ich kodu 6. ROVER, będąc na Emergency Channel nie wymaga od nas trzymania PTT (Push-To-Talk) aby zostać usłyszanym - mikrofon jest włączony przez 10 sekund cały czas i słyszy nas tylko RTO. Jednakże jeżeli w momencie trwania tych 30 sekund, oficer zdoła nacisnąć na PTT to sygnały przestają być podawane a sam oficer otrzymuje pełne pierwszeństwo w komunikatach i nadpisuje wszystkich, w tym samego RTO, na głównej częstotliwości tak aby wszyscy mogli go usłyszeć w pierwszej kolejności. Jeżeli pomoc dla oficera nie jest dłużej potrzebna - wystarczy, że ten zresetuje swoje urządzenie poprzez jego wyłączenie i ponowne włączenie.\n\nW przełożeniu tego na grę - macie absolutne prawo do wpisania /pb (LSPD) lub /pba (LSPD oraz inne agencje Law) z późniejszym nadaniem !1 lub nawet Whisper. Zezwalamy na drugą opcję ze względu, że jest to priorytet i możecie zostać usłyszani przez wszystkich, co nie będzie brane jako coś złego.\nTAC CHANNELS\nKanały taktyczne są specyficznym rodzajem częstotliwości używanych do określonych czynności, m.in. prowadzenie każdego rodzaju pościgów, tracking itd. W rzeczywistości również tak się dzieje, zaś po zakończeniu takich działań, scenę przenosi się na kanały Future Area Simplex Tac (pot. Simplex) lub Future Area Fallback Repeater Tac (pot. Fallback / Repeater) w zależności od wielkości sceny. Są dwa rodzaje kanałów taktycznych do działań dynamicznych:\n"},{"ty":"ae","et":"list","id":"kix.r5pe7wbrpyku","epm":{"le_nb":{"nl_4":{"b_gf":"%4","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_bd":false,"ts_fgc2_i":true,"ts_tw":400,"ts_it_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_st":false,"ts_sc_i":true},"b_ifl":162.0,"b_gs":"○","b_a":0,"b_sn":1,"b_gt":9,"b_il":180.0},"nl_3":{"b_gf":"%3","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_bd":false,"ts_fgc2_i":true,"ts_tw":400,"ts_it_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_st":false,"ts_sc_i":true},"b_ifl":126.0,"b_gs":"●","b_a":0,"b_sn":1,"b_gt":9,"b_il":144.0},"nl_2":{"b_gf":"%2","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_bd":false,"ts_fgc2_i":true,"ts_tw":400,"ts_it_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_st":false,"ts_sc_i":true j niż jedna stacja spod jednego biura.\n\nNie popełniajcie błędu mówiąc, że to oficer wybiera samodzielnie kanał taktyczny - robi do Dispatch. W momencie kiedy oficer puszcza informacje o sytuacji kryzysowej, np. pościg, to Dispatch powtarza cały komunikat dla wszystkich jednostek dla danej Stacji i podaje również kanał taktyczny, na który jednostki reagujące mają się przełączyć. Oczywiście jest to tylko rzecz dla waszej wiedzy poza grą, ze względu na brak obecnie możliwości rozgrywki Dispatchera, który takie kanały mógłby dla was przydzielać. Również w grze wasze kanały taktyczne będą brane jako Citywide TACs, a nie A-TACs, które wewnątrz LAPD nie zwyczajnie istnieją - są to kanały prędzej realne dla LASO (LASD). Dla uproszczenia rozgrywki na kanałach tych będziecie prowadzić działania dynamiczne oraz statyczne.\n\nPoniżej wymieniam rozpiskę częstotliwości odpowiadających kolejnym kanałom TAC:\n\nTac 1 - /rc 610\nTac 2 - /rc 620\nTac 3 - /rc 630\n\nKanały te posiadacie również w formie głosowej na TeamSpeak. Wchodząc na nie zawsze zidentyfikujcie jaka jednostka weszła na kanał. Pamiętajcie, że jednoczesne wejście na kanał głosowy równa się z wejściem na ten sam kanał pisemny - tam też możecie się zidentyfikować. Komunikacja na tych kanałach powinna pozostać jasna i spokojna, tzn. brak przekrzykiwania, brak wchodzenia w zdanie chyba, że jest to niezbędne, mówcie krótko i do rzeczy. Główną osobą, która powinna mówić przez większość czasu to Primary Unit podając lokalizację, np. pościgu. Taką osobą, która również powinna mieć pierwszeństwo w mówieniu jest Incident Commander.\nTALKAROUND CHANNELS\nTo wolne częstotliwości dla jednostek w terenie do luźnego porozumiewania się pomiędzy nimi do informowania się o zdarzeniach w terenie, do informowania sierżantów lecz bez aktywnego nadzoru Dispatch nad kanałem, stąd też identyfikacja na tych kanałach nie jest potrzebna lub jest uproszczona (zamiast 2 Adam 15 - Adam 15), a to ze względu na fakt, iż na takim kanale przebywają jedynie jednostki z danej zmiany, a więc oficerowie wiedzą mniej więcej kto może mówić w danym momencie. Kanały te dawniej były dla niektórych znane jako Simplex, ale było to błędne określenie i wycofujemy je.\n\nPoniżej wymieniam rozpiskę częstotliwości odpowiadających kolejnym kanałom Talkaround:\n\nTalkaround 1 - /rc 710\nTalkaround 2 - /rc 720\nTalkaround 3 - /rc 730\nMAID CHANNELS\nMutual Aid Channels obejmują różne części hrabstwa i pozwalają LASO (LASD) i sąsiednim departamentom, np. LAPD, koordynować pomoc innym, czyli wszystkie rodzaje działań taktycznych i statycznych. Kanały te ogólnie służą do współpracy między różnymi departamentami, głównie spod szyldu “Law”. Kanały te są operowane przez SCC (Sheriffs Communication Center) ze strony LASO (LASD). Ich otagowanie to “Law Tac”, podzielone są one ze względu na kierunki geograficzne hrabstwa. W trakcie rozgrywki macie dostęp do trzech takich kanałów zarówno w formie głosowej na TeamSpeak jak i pisemnej, których częstotliwości wymieniam poniżej:\n\nMutual Aid 1 - /rc 510\nMutual Aid 2 - /rc 520\nMutual Aid 3 - /rc 530\n\nPamiętajcie aby wchodząc na tego rodzaju kanały zidentyfikować swoją jednostkę w postaci: Callsign, Police - preferuje się aby wykonać to pisemnie na kanale za pomocą /r.\nPHONETIC ALPHABET\nWewnątrz LAPD używa się alfabetu fonetycznego, dlaczego? Jego użytkowanie nie tylko znajduje zastosowanie wewnątrz tego jednego departamentu, ale i w każdej innej agencji na całym świecie, tak samo w wojskach. Całym zamysłem jego użytkowania jest zwiększenie szansy zrozumienia podawanej litery przez nadającego do odbierającego sygnał - oficer \u003e dispatch. Dla Dispatch łatwiej zrozumieć jest “Adam” niż “A” i wtedy wpisać literę A. Poniżej znajduje się właśnie alfabet fonetyczny używany przez LAPD:\n"},{"ty":"ae","et":"list","id":"kix.9jmd61h8vhuk","epm":{"le_nb":{"nl_4":{"b_gf":"%4","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_b \u001cK\n\u001cKing\n\u001cX\n\u001cX-ray\n\u001c\n\u001c\n\u0012\u001cL\n\u001cLincoln\n\u001cY\n\u001cYoung\n\u001c\n\u001c\n\u0012\u001cM\n\u001cMary\n\u001cZ\n\u001cZebra\n\u001c\n\u001c\n\u0011\nMile widziane jest stosowanie tego alfabetu szczególnie na kanale Dispatch. Nie wymagamy od was zapisywania liczb słownie, możecie dalej używać do tego cyfr. Jeżeli gracie postać, która posiada przeszłość z każdym rodzajem US Army, to również możecie przeplatać tam ich alfabet fonetyczny.\nCALLSIGN\nCallsign to inaczej wasza nazwa wywoławcza na radiu, nie będę wypisywać każdego rodzaju Callsign jaki jest dostępny w LAPD - wypiszę tylko te, które są rzeczywiście używane wewnątrz naszej frakcji.\n\n\u0010\u0012\u001cA\n\u001cAdam\n\u001cPodstawowa dwuosobowa jednostka patrolowa.\n\u0012\u001cL\n\u001cLincoln\n\u001cPodstawowa jednoosobowa jednostka patrolowa.\n\u0012\u001cG\n\u001cGeorge\n\u001cJednostka Gang Impact Team, Gang Enforcement Detail.\n\u0012\u001cM\n\u001cMary\n\u001cJednostka motocyklowa Traffic Enforcement.\n\u0012\u001cR\n\u001cRobert\n\u001cJednostka Metropolitan Division.\n\u0012\u001cK9\n\u001cCanine\n\u001cJednostka K9.\n\u0012\u001cW\n\u001cWilliam\n\u001cJednostka Area Detectives.\n\u0012\u001cX\n\u001cXray\n\u001cDodatkowa jednostka patrolowa przypisana do danego terenu.\n\u0012\u001cAIR\n\u001cAir\n\u001cPowietrzna jednostka patrolowa. Zawsze identyfikowana jako AIR-2, jeżeli spod stacji 2.\n\u0011\nWszelkie jednostki Adam, Lincoln będą tworzyć callsign zgodnie z zasadą: w pierwszej kolejności idzie numer waszej stacji, następnie litera identyfikująca rodzaj jednostki, końcowo dwucyfrowa liczba, która nie posiada “zero” na końcu. Jednostki Xray również mogą występować w wersji Lincoln, wtedy ich callsign będzie znany jako “XL”, reszta zasad utworzenia callsign jest taka sama jak dla podstawowych jednostek patrolowych. Supervisory Staff oraz Watch Commanders posiadają dodatkowe restrykcje odnośnie tworzenia Callsign. Supervisory Staff, będzie oznaczony numerem kończącym się na \"zero\" z wyłączeniem \"10\" i \"90\". Jednostki Watch Supervisory Staff będą identyfikowane poprzez numer przydzielonego obszaru, literę \"L,\" i dwucyfrową liczbę kończącą się na \"zero.\" Numer \"10\" będzie oznaczać Watch Commander. Assistant Watch Commander będzie identyfikować się identycznie jak Watch Commander, lecz jego numerem będzie “20”.\nRADIO CODES AND COMMON USE PHRASES\nWprowadzone w użytkowanie, w radiokomunikacji, kody radiowe LAPD są jej ważnym elementem, który ułatwia i przyspiesza komunikację pomiędzy oficerami i Dispatch.\n\n\u0010\u0012\u001cKOD 2\n\u001cW przypadku gdy jednostka odpowiada do nagłego incydentu, który nie wymaga użycia sygnalizacji pojazdu. Oficerowie, odpowiadając w kodzie drugim, powinni zawsze stosować się do zasad ruchu. To domyślny typ dojazdu, jeśli chcecie nim reagować - nie wskazujecie tego specjalnie w komunikacie (po prostu “w drodze” etc.).\n\u0012\u001cKOD 3\n\u001cTo dojazd na zgłoszenie z wysokim priorytetem, gdzie mamy zagrożenie zdrowia, lub życia. Poruszając się za pośrednictwem KOD 3 - jednostka używa sygnalizacji świetlnej i dźwiękowej, ma prawo naginać ruch drogowy z zachowaniem najwyższej ostrożności.\n\u0012\u001cKOD 4\n\u001cOznacza to brak potrzeby dalszego wsparcia. Nie oznacza to zwolnienia jednostek z incydentu, które już na niej są - jedynie tych, które są w drodze, jeszcze się nie zjawiły.\n\u0012\u001cKOD 4 ADAM\n\u001cOznacza to brak potrzeby dalszego bezpośredniego wsparcia dodatkowych jednostek na scenie, lecz jednostki, które są w drodze mogą pozostać w okolicy incydentu w razie potrzeby szybkiego zareagowania. Scena nie została jeszcze w pełni opanowana. \n\u0012\u001cKOD 5\n\u001cUnikaj danego obszaru. Miejsce może być uczęszczane przez oficerów tylko w przypadku nagłego incydentu. Używane podczas obserwacji, DUI etc.\n\u0012\u001cKOD 6\n\u001cJednostka prowadzi czynności, najczęściej poza wozem. Nadal jest dostępna do wezwań wysokiego priorytetu. Nie wymaga wsparcia.\n\u0012\u001cKOD 6 ADAM\n\u001cJednostka prowadzi czynności, ale wymaga asysty dodatkowych oficerów (ogólne).\n\u0012\u001cKOD 6 CHARLES\n\u001cUżywany w komunikacji do określania niebezpiecznego podejrzanego lub pojazdu, osób uzbrojonych lub poszukiwanych za felony. Na przykład w odpowiedzi na KOD 10 oficerowie mogą otrzymać kod szósty Charles, co oznacza że sprawdzana osoba jest niebezpieczna i powinni zachować ostrożność.\n\u0012\u001cKOD 6 GEORGE\n\u001cJednostka prowadzi czynności, ale wymaga wsparcia dodatkowych oficerów (teren aktywności gangów, aktywność Gang Members).\n\u0012\u001cKOD 7\n\u001cPrzerwa w pracy (w momencie zapotrzebowania oficer musi porzucić jedzenie, lub cokolwiek innego czym zajmował się na przerwie i jak najszybciej ruszyć do obowiązków).\n\u0012\u001cKOD 10\n\u001cProśba o sprawdzenie osoby lub pojazdu przez Dispatch w bazie danych. Oficer musi podać imię, nazwisko oraz DOB osoby, lub jeżeli potrzebuje sprawdzenia pojazdu - tablice.\n\u0012\u001cKOD 37\n\u001cOznaczenie dla skradzionego pojazdu.\n\u0012\u001cKOD 100\n\u001cKod ten jest nadawany przez jednostkę w celu powiadomienia innych jednostek, że możliwa droga ucieczki podejrzanego z miejsca przestępstwa jest pod obserwacją. „Kod 100” powinien być nadawany w następującej kolejności: Callsign; „Kod 100”; oraz lokalizacja.\n\u0012\u001cAC\n\u001cAircraft Crash\n\u0012\u001cTC\n\u001cTraffic Collision.\n\u0012\u001cDB\n\u001cDead Body.\n\u0012\u001cIC\n\u001cIncident Commander.\n\u0012\u001cPR\n\u001cPerson Reporting.\n\u0012\u001cRA\n\u001cRescue Ambulance.\n\u0012\u001cRO\n\u001cRegistered Owner.\n\u0012\u001c211\n\u001cNapad.\n\u0012\u001c311\n\u001cNieprzyzwoite zachowanie.\n\u0012\u001c390\n\u001cPijany mężczyzna.\n\u0012\u001c390W\n\u001cPijana kobieta.\n\u0012\u001c415\n\u001cZakłócanie porządku.\n\u0012\u001c459\n\u001cWłamanie.\n\u0012\u001c484\n\u001cKradzież.\n\u0012\u001c502\n\u001cJazda pod wpływem.\n\u0012\u001c586\n\u001cNielegalne parkowanie.\n\u0012\u001cRoger\n\u001cPrzyjął.\n\u0012\u001cCome in\n\u001cJesteś wywoływany.\n\u0012\u001cStand by\n\u001cOczekuj.\n\u0012\u001cGo ahead\n\u001cNadaj komunikat.\n\u0012\u001cRepeat\n\u001cPowtórz.\n\u0012\u001cJuvenile Check\n\u001cUstalenie, czy osoba nieletnia jest poszukiwana, zatrzymana lub karana (Kod 10 na nieletnim).\n\u0012\u001cEnd of Watch\n\u001cJednostka zakończyła swoją służbę.\n\u0011"},{"ty":"as","st":"paragraph","si":12357,"ei":12357,"sm":{"ps_klt_i":true,"ps_awao_i":true,"ps_sm_i":true,"ps_ls_i":true,"ps_il_i":true,"ps_ir_i":true,"ps_al_i":false,"ps_bl_i":true,"ps_sd_i":true,"ps_sb_i":true,"ps_sa_i":true,"ps_lslm_i":true,"ps_br_i":true,"ps_bbtw_i":true,"ps_kwn_i":true,"ps_bt_i":true,"ps_al":3,"ps_ifl_i":true,"ps_bb_i":true,"ps_pbb_i":true}},{"ty":"as","st":"tbl","si":12358,"ei":12358,"sm":{"tbls_cols":{"cv":{"op":"set","opValue":[{"col_wv":45.0,"col_wt":0,"col_tdt":{"tdt_v":0},"col_tf":{"ttf_vn":0,"ttf_n":""}},{"col_wv":80.25,"col_wt":0,"col_tdt":{"tdt_v":0},"col_tf":{"ttf_vn":0,"ttf_n":""}},{"col_wv":54.0,"col_wt":0,"col_tdt":{"tdt_v":0},"col_tf":{"ttf_vn":0,"ttf_n":""}},{"col_wv":81.0,"col_wt":0,"col_tdt":{"tdt_v":0},"col_tf":{"ttf_vn":0,"ttf_n":""}},{"col_wv":53.25,"col_wt":0,"col_tdt":{"tdt_v":0},"col_tf":{"ttf_vn":0,"ttf_n":""}},{"col_wv":88.5,"col_wt":0,"col_tdt":{"tdt_v":0},"col_tf":{"ttf_vn":0,"ttf_n":""}}]}},"tbls_al":1,"tbls_tblid":"table.7vd1yktg0zni"}},{"ty":"as","st":"paragraph","si":12367,"ei":12367,"sm":{"ps_ls":1.0,"ps_al":3,"ps_ls_i":false,"ps_al_i":false}},{"ty":"as","st":"paragraph","si":12377,"ei":12377,"sm":{"ps_ls":1.0,"ps_al":3,"ps_ls_i":false,"ps_al_i":false}},{"ty":"as","st":"paragraph","si":12385,"ei":12385,"sm":{"ps_ls":1.0,"ps_al":3,"ps_ls_i":false,"ps_al_i":false}},{"ty":"as","st":"paragraph","si":12395,"ei":12395,"sm":{"ps_ls":1.0,"ps_al":3,"ps_ls_i":false,"ps_al_i":false}},{"ty":"as","st":"paragraph","si":12403,"ei":12403,"sm":{"ps_ls":1.0,"ps_al":3,"ps_ls_i":false,"ps_al_i":false}},{"ty":"as","st":"paragraph","si":12413,"ei":12413,"s nsmisji zawsze powinno dodać się lokalizację i inne dodatkowe informacje. Przykład:\n\n2A13, padły strzały, oficer w potrzebie! Magellan Avenue, Goma Street!\n2A21, w kodzie trzecim do oficera w potrzebie.\n\nBack-up Unit Request (jednostka wsparcia). Oficerowie wzywający jednostkę wsparcia potrzebują natychmiastowej pomocy większej ilości sił departamentu, jednak sytuacja nie jest jeszcze na poziomie zagrożenia życia. Przykład:\n\n2A43, mam gunpoint na mężczyźnie z nożem w ręku, daj mi wsparcie dwóch!\n2A13, reaguje do wsparcia dla 2A43, kod 3.\n\nAdditional Unit Request (asysta, dodatkowa jednostka). Oficer wzywający jednostkę asysty nie jest w sytuacji wymagającej natychmiastowej pomocy. Wzywając jednostkę asysty, powinna zostać podana również lokalizacja. Oficerowie odpowiadający do wniosku o dodatkową jednostkę nie powinni używać kodu 3 i powinni stosować się do zasad ruchu. Przykład:\n\n2A9, rozpoczynam T-Stop na czarnej Asea, tablice to Adam-3-Boy-2-Charles-1. Hawick Avenue w Burton, daj mi jedną asysty. Kod 6.\n2A16, odpowiadam do asysty dla 2A9.\nCRIME BROADCAST\nPierwsi oficerowie przybyli na miejsce przestępstwa przeprowadzają krótką rozmowę z ofiarą lub świadkami. Informacje, o ile ma to zastosowanie, należy niezwłocznie przekazywać operatorowi łączności w następującej kolejności:\n\nRodzaj przestępstwa;\nMiało miejsce ______ minut temu;\nLokalizacja;\nUżyty pojazd (lub czy pieszo);\nKierunek;\nLiczba, płeć, pochodzenie podejrzanych;\nCechy szczególne;\nBroń; oraz,\nOgólny rodzaj zabranego mienia. \n\nPrzed podaniem ww. informacji należy podać Callsign oraz poinformować Dispatch o nadchodzącej transmisji przestępstwa. Zakończenie transmisji również powinno zostać podkreślone poprzez poinformowanie o tym Dispatch.\nPURSUIT BROADCAST\nProcedura Pościgu. Jednostka rozpoczynająca pościg powinna rozpocząć od transmitowania swojego call-sign, zaraz po tym powinna określić markę oraz kolor pojazdu, znaki szczególne, kierunek, w którym się porusza oraz samo stwierdzenie, że jednostka jest w pościgu. Oficerowie w pościgu zmotoryzowanym zawsze powinni poprosić o wsparcie supervisory oraz dodatkowych jednostek i Airship. Jeżeli zgłoszenie pełnych informacji nie jest możliwe - należy zgłosić tylko najważniejsze informacje takie jak callsign, stwierdzenie że jednostka jest w pościgu, za jakim pojazdem oraz gdzie. Dispatch wtedy powtarza wasz komunikat dla pozostałych jednostek oraz wyznacza kanał taktyczny (na koniec komunikatu sami wybierzcie ten, który jest wolny). Przykłady:\n\n2A24, w pościgu za czarną Asea, z Południowego Rockford Drive na Palomino Avenue, Tac 1!\n2A15, w pościgu za czerwonym Sabre, z Vespucci na Little Seul, daj mi wsparcie dodatkowych, Supervisory oraz Airship na Tac 1!\n2A33, w pościgu za szarym Sadlerem, tablice Adam-3-Boy-2-Charles-1, w kierunku Little Seul z Downtown, potrzebuje wsparcia dodatkowych, Supervisory oraz Airship na Tac-1!\n2A8, w pościgu pieszym za uzbrojonym czarnoskórym mężczyzną, niebieska bluza, białe spodenki, Vespucci Beach na zachód, Tac 2.\n\nZgłoszenie pościgu przez jednostkę Lincoln jest oczywiste - musi zrobić to poprzez Whisper. Jednakże utarło się, że jednostki Adam zawsze muszą pisać taki komunikat - zmienimy to i od teraz jednostki Adam mogą również zgłaszać swój pierwszy komunikat za pomocą Whispera lecz następne niech preferowane będzie już używanie do tego !1. Zgłaszając coś głosowo starajcie się mówić wasze callsigny całościowo, tzn. zamiast 2A15 to 2 Adam 15. Dodatkowo aby uniknąć wszelkiego zamieszania na kanałach taktycznych w trakcie prowadzenia pościgów - na kanałach głosowych Tac odzywa się tylko:\n"},{"ty":"ae","et":"list","id":"kix.2ynh286ylv3k","epm":{"le_nb":{"nl_4":{"b_gf":"%4","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_bd":false,"ts_fgc2_i":true,"ts_tw"
